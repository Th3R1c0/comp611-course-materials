<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one narrow study column, like a single A4 strip; each sheet line is a row that opens to a plain-English note. */
:root {

  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14181d; --card: #1b2027; --ink: #e6e9ec; --muted: #9aa5b1;

:root[data-theme="dark"] {
  --paper: #14181d; --card: #1b2027; --ink: #e6e9ec; --muted: #9aa5b1;

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.id { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }
details { border-top: 1px solid var(--rule); }

.plain { background: var(--note); border-left: 3px solid var(--note-edge); padding: 10px 12px; margin: 0 0 10px 22px; border-radius: 0 6px 6px 0; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.plain p { margin: 0; }
.plain .eg { font-family: var(--mono); font-size: 13.5px; }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }

.id { white-space: nowrap; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.calc { font-family: var(--mono); font-size: 14px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; line-height: 1.6; }

.ex h3 { font-size: 15.5px; margin: 0; }
.ex p { margin: 0; }
a { color: var(--accent); }
.topic { font-family: var(--display); font-size: 21px; margin-top: 10px; text-wrap: balance; }
:root { --cu: #1f5fa8; --cw: #b5590f; --cv: #2f7d3a; --cu-bg: #e6eef8; --cw-bg: #fbeee2; --cv-bg: #e7f3e8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cu: #8bb8ee; --cw: #f0a868; --cv: #8fd19a; --cu-bg: #1e2a3a; --cw-bg: #33251a; --cv-bg: #1a2b1d; } }
:root[data-theme="dark"] { --cu: #8bb8ee; --cw: #f0a868; --cv: #8fd19a; --cu-bg: #1e2a3a; --cw-bg: #33251a; --cv-bg: #1a2b1d; }
.cu, .cw, .cv { font-weight: 700; padding: 0 3px; border-radius: 3px; }
.cu { color: var(--cu); background: var(--cu-bg); } .cw { color: var(--cw); background: var(--cw-bg); } .cv { color: var(--cv); background: var(--cv-bg); }

.fig { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 6px; max-width: 100%; height: auto; display: block; }
.figcap { font-size: 14px; color: var(--muted); margin: 0; }
.calc { white-space: pre-wrap; }
